<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 570" role="img" aria-labelledby="fold-title fold-desc">
  <title id="fold-title">Matter Fold: from an open material lattice to an ordered device</title>
  <desc id="fold-desc">An orange sheet folds through three geometric planes above a forest-green grid of material cells. The illustration expresses the transformation of biological materials into functional hardware.</desc>
